name: Linters and Tests

on:
  workflow_call:

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out the code
        uses: https://data.forgejo.org/actions/checkout@v7

      - name: Set up Python
        uses: https://data.forgejo.org/actions/setup-python@v7
        with:
          python-version: "3.14.x"

      - name: Run linter
        uses: https://github.com/pre-commit/action@v3.0.1
        env:
          SKIP: no-commit-to-branch

  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out the code
        uses: https://data.forgejo.org/actions/checkout@v7

      - name: Run container tests
        run: |
          make build
